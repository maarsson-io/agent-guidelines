name: Validate package

'on':
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate guidelines and skills
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
        env:
          update: true

      - name: Validate Composer manifest
        run: composer --no-plugins --no-scripts validate --strict --no-check-lock

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-plugins --no-scripts

      - name: Validate skills, routing, and consumer paths
        run: php scripts/validate_resources.php

      - name: Test skill directory linking
        run: php tests/link_skills.php

      - name: Test project initialization
        run: php tests/initialize_project.php
